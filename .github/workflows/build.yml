# Checks the formatting, builds Polarity and runs the unit tests on every push
# and pull request, and keeps the release files as an artifact for two weeks.
# A pushed v<version> tag also attests those files and puts them in a draft
# GitHub Release with the version's CHANGELOG.md section. scripts/release.ps1
# then checks and publishes the draft and signs the update info
# (docs/updater.md).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Formatting
        shell: pwsh
        run: scripts/format.ps1 -Check

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Unit tests
        run: build\Release\sfvtests.exe

      - name: Release files
        shell: pwsh
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/release-files.ps1 -Tag $env:TAG

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/release/
            dist/release-notes.md
          retention-days: 14
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Polarity ${TAG#v}" --notes-file release-notes.md release/*
